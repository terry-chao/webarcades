<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🕹️ Web Arcade | 网页游戏合集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6329205502545792" crossorigin="anonymous"></script>
</head>
<body>
  <div id="arcade">
    <!-- Header -->
    <header id="header">
      <h1 class="title">🕹️ WEB ARCADE</h1>
      <p class="subtitle" data-zh="网页游戏合集" data-en="Web Game Collection">网页游戏合集</p>
      <button id="langToggle" title="切换语言">中/EN</button>
    </header>

    <!-- Game grid -->
    <main id="games">
      <!-- Tank Battle -->
      <a href="tank-battle/index.html" class="card" id="card-tank">
        <canvas id="preview-tank" width="280" height="180"></canvas>
        <div class="card-info">
          <h2 data-zh="坦克大战" data-en="Tank Battle">坦克大战</h2>
          <p class="card-en">Tank Battle</p>
          <p class="card-desc" data-zh="经典 FC 坦克大战，5个关卡，4种敌人，6种道具" data-en="Classic FC Tank Battle · 5 levels · 4 enemy types · 6 power-ups">经典 FC 坦克大战，5个关卡，4种敌人，6种道具</p>
          <span class="tag play">▶ PLAY</span>
        </div>
      </a>

      <!-- Match 3 -->
      <a href="match3/index.html" class="card" id="card-match3">
        <canvas id="preview-match3" width="280" height="180"></canvas>
        <div class="card-info">
          <h2 data-zh="消消乐" data-en="Match 3">消消乐</h2>
          <p class="card-en">Match 3</p>
          <p class="card-desc" data-zh="经典三消游戏，交换宝石消除得分，连击加分" data-en="Classic match-3 · swap gems to score · combo bonus">经典三消游戏，交换宝石消除得分，连击加分</p>
          <span class="tag play">▶ PLAY</span>
        </div>
      </a>

      <!-- Snake -->
      <a href="snake/index.html" class="card" id="card-snake">
        <canvas id="preview-snake" width="280" height="180"></canvas>
        <div class="card-info">
          <h2 data-zh="贪吃蛇" data-en="Snake">贪吃蛇</h2>
          <p class="card-en">Snake</p>
          <p class="card-desc" data-zh="经典贪吃蛇，吃食物变长，挑战最高分" data-en="Classic Snake · eat food to grow · beat the high score">经典贪吃蛇，吃食物变长，挑战最高分</p>
          <span class="tag play">▶ PLAY</span>
        </div>
      </a>

      <!-- Tetris -->
      <a href="tetris/index.html" class="card" id="card-tetris">
        <canvas id="preview-tetris" width="280" height="180"></canvas>
        <div class="card-info">
          <h2 data-zh="俄罗斯方块" data-en="Tetris">俄罗斯方块</h2>
          <p class="card-en">Tetris</p>
          <p class="card-desc" data-zh="经典方块消除，7种方块，等级递增，挑战极限" data-en="Classic block puzzle · 7 tetrominoes · level progression · push your limits">经典方块消除，7种方块，等级递增，挑战极限</p>
          <span class="tag play">▶ PLAY</span>
        </div>
      </a>

      <!-- Space Invaders -->
      <a href="invaders/index.html" class="card" id="card-invaders">
        <canvas id="preview-invaders" width="280" height="180"></canvas>
        <div class="card-info">
          <h2 data-zh="太空侵略者" data-en="Space Invaders">太空侵略者</h2>
          <p class="card-en">Space Invaders</p>
          <p class="card-desc" data-zh="击退外星入侵者，保护地球，经典射击游戏" data-en="Defend Earth from alien invaders · classic arcade shooter">击退外星入侵者，保护地球，经典射击游戏</p>
          <span class="tag play">▶ PLAY</span>
        </div>
      </a>
    </main>

    <footer id="footer">
      <p data-zh="🎮 纯 Canvas + Web Audio API · 无需安装 · 点击即玩" data-en="🎮 Pure Canvas + Web Audio API · No Install · Click to Play">🎮 纯 Canvas + Web Audio API · 无需安装 · 点击即玩</p>
    </footer>
  </div>

  <script src="js/home.js"></script>
</body>
</html>
