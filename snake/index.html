<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>贪吃蛇 | Snake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="gameWrapper">
    <div id="hud">
      <div class="hud-item"><span class="hud-label">SCORE</span><span id="scoreVal">0</span></div>
      <div class="hud-item"><span class="hud-label">HIGH</span><span id="highVal">0</span></div>
      <div class="hud-item"><span class="hud-label">SPEED</span><span id="speedVal">1</span></div>
    </div>
    <canvas id="gameCanvas" width="480" height="480"></canvas>
    <div id="message">PRESS SPACE<span class="sub">or tap to start</span></div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
